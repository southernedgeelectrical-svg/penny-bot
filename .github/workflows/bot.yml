name: Penny Bot

on:
  schedule:
    - cron: "50 14,17,19 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal trading pass, backtest = test on 2 years of history"
        type: choice
        options: [run, backtest]
        default: run

permissions:
  contents: write

concurrency:
  group: penny-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run bot (paper only)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python bot.py ${{ github.event.inputs.mode || 'run' }}
      - name: Save results
        if: always()
        run: |
          git config user.name "penny-bot"
          git config user.email "penny-bot@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Bot run $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
